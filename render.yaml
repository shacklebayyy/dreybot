services:
  # 1-Click Free Web Service + Telegram Bot Worker
  - type: web
    name: dreydocs-web
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./run.sh"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: USE_SQLITE
        value: "True"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
