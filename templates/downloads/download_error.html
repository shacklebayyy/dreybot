{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center shadow-2xl">
        <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto text-3xl font-bold mb-4">
            ⚠️
        </div>
        <h2 class="text-2xl font-bold text-white mb-2">Download Error</h2>
        <p class="text-slate-400 text-sm mb-6">{{ error }}</p>
        <a href="/" class="inline-block px-6 py-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-medium text-sm transition">
            Return to Home
        </a>
    </div>
</div>
{% endblock %}
