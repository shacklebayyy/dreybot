{% extends 'dashboard/base.html' %}

{% block header_title %}Create New Product{% endblock %}

{% block content %}
<div class="max-w-3xl bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Product Name</label>
            <input type="text" name="name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Category</label>
                <select name="category" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
                    {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Country (Optional)</label>
                <select name="country" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
                    <option value="">Global / None</option>
                    {% for cnt in countries %}
                    <option value="{{ cnt.id }}">{{ cnt.flag_emoji }} {{ cnt.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">State / Region (Optional)</label>
                <select name="state" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
                    <option value="">None</option>
                    {% for st in states %}
                    <option value="{{ st.id }}">{{ st.name }} ({{ st.country.name }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Price ($)</label>
                <input type="number" step="0.01" name="price" value="12.00" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">File Format</label>
                <input type="text" name="file_type" value="PSD" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">File Size</label>
                <input type="text" name="file_size" value="15 MB" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Description</label>
            <textarea name="description" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Preview Image</label>
                <input type="file" name="preview_image" accept="image/*" class="w-full text-slate-400 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Downloadable File</label>
                <input type="file" name="downloadable_file" class="w-full text-slate-400 text-sm">
            </div>
        </div>

        <div class="flex items-center space-x-6">
            <label class="flex items-center space-x-2 text-sm text-slate-300">
                <input type="checkbox" name="is_active" checked class="w-4 h-4 rounded text-cyan-600 bg-slate-950 border-slate-800">
                <span>Active</span>
            </label>
            <label class="flex items-center space-x-2 text-sm text-slate-300">
                <input type="checkbox" name="is_featured" class="w-4 h-4 rounded text-cyan-600 bg-slate-950 border-slate-800">
                <span>Featured Product</span>
            </label>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-sm transition">
            Save Product
        </button>
    </form>
</div>
{% endblock %}
